services:
  # 1. PostgreSQL 16
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fisilti_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-fisilti}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fisilti_user} -d ${POSTGRES_DB:-fisilti}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fisilti-network

  # 2. Redis 7
  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fisilti-network

  # 3. MinIO S3 Depolama
  minio:
    image: quay.io/minio/minio:latest
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - fisilti-network
      - coolify
    labels:
      - "traefik.enable=${TRAEFIK_ENABLE_S3:-true}"
      - "traefik.http.middlewares.fisilti-s3-strip.stripprefix.prefixes=${TRAEFIK_S3_STRIP_PREFIX:-/b/s3}"
      - "traefik.http.routers.fisilti-s3-http.rule=${TRAEFIK_S3_RULE:-Host(`s3.${DOMAIN:-fisilti.app}`)}"
      - "traefik.http.routers.fisilti-s3-http.entrypoints=http"
      - "traefik.http.routers.fisilti-s3-http.middlewares=fisilti-redirect-https,crowdsec@file"
      - "traefik.http.routers.fisilti-s3.rule=${TRAEFIK_S3_RULE:-Host(`s3.${DOMAIN:-fisilti.app}`)}"
      - "traefik.http.routers.fisilti-s3.entrypoints=https"
      - "traefik.http.routers.fisilti-s3.tls=true"
      - "traefik.http.routers.fisilti-s3.tls.certresolver=letsencrypt"
      - "traefik.http.routers.fisilti-s3.middlewares=${TRAEFIK_S3_MIDDLEWARES:-crowdsec@file}"
      - "traefik.http.routers.fisilti-s3.priority=${TRAEFIK_S3_PRIORITY:-120}"
      - "traefik.http.services.fisilti-s3.loadbalancer.server.port=9000"

  # MinIO Başlangıç Bucket Oluşturucu (Tek seferlik)
  minio-init:
    image: quay.io/minio/mc:latest
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_AVATARS: ${MINIO_BUCKET_AVATARS:-avatars}
      MINIO_BUCKET_VOICE: ${MINIO_BUCKET_VOICE:-audio-messages}
      MINIO_BUCKET_MEDIA: ${MINIO_BUCKET_MEDIA:-media}
      MINIO_BUCKET_FILES: ${MINIO_BUCKET_FILES:-files}
    depends_on:
      - minio
    networks:
      - fisilti-network
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}); do echo 'MinIO bekleniyor...' && sleep 2; done;
      /usr/bin/mc mb --ignore-existing local/$${MINIO_BUCKET_AVATARS};
      /usr/bin/mc mb --ignore-existing local/$${MINIO_BUCKET_VOICE};
      /usr/bin/mc mb --ignore-existing local/$${MINIO_BUCKET_MEDIA};
      /usr/bin/mc mb --ignore-existing local/$${MINIO_BUCKET_FILES};
      /usr/bin/mc anonymous set download local/$${MINIO_BUCKET_AVATARS};
      /usr/bin/mc anonymous set download local/$${MINIO_BUCKET_VOICE};
      /usr/bin/mc anonymous set download local/$${MINIO_BUCKET_MEDIA};
      /usr/bin/mc anonymous set download local/$${MINIO_BUCKET_FILES};
      echo 'MinIO bucketlari hazirlandi.';
      exit 0;
      "

  # 4. LiveKit WebRTC SFU
  livekit:
    image: livekit/livekit-server:latest
    restart: always
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}:${LIVEKIT_API_SECRET}"
      LIVEKIT_REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
    ports:
      - "7881:7881/udp"
      - "7881:7881/tcp"
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml:ro
    depends_on:
      - redis
    networks:
      - fisilti-network
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.fisilti-livekit-http.rule=${TRAEFIK_LIVEKIT_RULE:-Host(`livekit.${DOMAIN:-fisilti.app}`)}"
      - "traefik.http.routers.fisilti-livekit-http.entrypoints=http"
      - "traefik.http.routers.fisilti-livekit-http.middlewares=fisilti-redirect-https,crowdsec@file"
      - "traefik.http.routers.fisilti-livekit.rule=${TRAEFIK_LIVEKIT_RULE:-Host(`livekit.${DOMAIN:-fisilti.app}`)}"
      - "traefik.http.routers.fisilti-livekit.entrypoints=https"
      - "traefik.http.routers.fisilti-livekit.tls=true"
      - "traefik.http.routers.fisilti-livekit.tls.certresolver=letsencrypt"
      - "traefik.http.routers.fisilti-livekit.middlewares=crowdsec@file"
      - "traefik.http.services.fisilti-livekit.loadbalancer.server.port=7880"

  # 5. Go Backend Servisi
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env
    environment:
      APP_BASE_PATH: "${APP_BASE_PATH:-}"
      COOKIE_PATH: "${COOKIE_PATH:-${APP_BASE_PATH:-/}}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-}"
    depends_on:
      - postgres
      - redis
      - minio
    networks:
      - fisilti-network
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.http.middlewares.fisilti-backend-strip.stripprefix.prefixes=${TRAEFIK_BACKEND_STRIP_PREFIX:-/b}"
      - "traefik.http.routers.fisilti-backend-http.rule=${TRAEFIK_BACKEND_RULE:-Host(`api.${DOMAIN:-fisilti.app}`)}"
      - "traefik.http.routers.fisilti-backend-http.entrypoints=http"
      - "traefik.http.routers.fisilti-backend-http.middlewares=fisilti-redirect-https,crowdsec@file"
      - "traefik.http.routers.fisilti-backend.rule=${TRAEFIK_BACKEND_RULE:-Host(`api.${DOMAIN:-fisilti.app}`)}"
      - "traefik.http.routers.fisilti-backend.entrypoints=https"
      - "traefik.http.routers.fisilti-backend.tls=true"
      - "traefik.http.routers.fisilti-backend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.fisilti-backend.middlewares=${TRAEFIK_BACKEND_MIDDLEWARES:-crowdsec@file}"
      - "traefik.http.routers.fisilti-backend.priority=${TRAEFIK_BACKEND_PRIORITY:-100}"
      - "traefik.http.services.fisilti-backend.loadbalancer.server.port=8080"

  # 6. Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BASE_PATH: "${NEXT_PUBLIC_BASE_PATH:-}"
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-}"
        NEXT_PUBLIC_WS_URL: "${NEXT_PUBLIC_WS_URL:-}"
        NEXT_PUBLIC_LIVEKIT_URL: "${NEXT_PUBLIC_LIVEKIT_URL:-}"
    restart: always
    environment:
      NEXT_PUBLIC_BASE_PATH: "${NEXT_PUBLIC_BASE_PATH:-}"
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-}"
      NEXT_PUBLIC_WS_URL: "${NEXT_PUBLIC_WS_URL:-}"
      NEXT_PUBLIC_LIVEKIT_URL: "${NEXT_PUBLIC_LIVEKIT_URL:-}"
    depends_on:
      - backend
    networks:
      - fisilti-network
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.http.middlewares.fisilti-redirect-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.fisilti-redirect-https.redirectscheme.permanent=true"
      - "traefik.http.routers.fisilti-frontend-http.rule=${TRAEFIK_FRONTEND_RULE:-Host(`${DOMAIN:-fisilti.app}`)}"
      - "traefik.http.routers.fisilti-frontend-http.entrypoints=http"
      - "traefik.http.routers.fisilti-frontend-http.middlewares=fisilti-redirect-https,crowdsec@file"
      - "traefik.http.routers.fisilti-frontend.rule=${TRAEFIK_FRONTEND_RULE:-Host(`${DOMAIN:-fisilti.app}`)}"
      - "traefik.http.routers.fisilti-frontend.entrypoints=https"
      - "traefik.http.routers.fisilti-frontend.tls=true"
      - "traefik.http.routers.fisilti-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.fisilti-frontend.middlewares=crowdsec@file"
      - "traefik.http.routers.fisilti-frontend.priority=${TRAEFIK_FRONTEND_PRIORITY:-50}"
      - "traefik.http.services.fisilti-frontend.loadbalancer.server.port=3000"

volumes:
  pg_data:
  redis_data:
  minio_data:

networks:
  fisilti-network:
    driver: bridge
  coolify:
    external: true
