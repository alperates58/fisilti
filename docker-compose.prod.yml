services:
  # 1. PostgreSQL 16
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fisilti_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-fisilti}
    volumes:
      - type: bind
        source: ${POSTGRES_DATA_PATH}
        target: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fisilti_user} -d ${POSTGRES_DB:-fisilti}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      fisilti-network:
        aliases:
          - ${POSTGRES_HOST:-fisilti-postgres}

  # 2. Redis 7
  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - type: bind
        source: ${REDIS_DATA_PATH}
        target: /data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      fisilti-network:
        aliases:
          - ${REDIS_HOST:-fisilti-redis}

  # 3. MinIO S3 Depolama
  minio:
    image: quay.io/minio/minio:latest
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - type: bind
        source: ${MINIO_DATA_PATH}
        target: /data
    networks:
      fisilti-network:
        aliases:
          - ${MINIO_HOST:-fisilti-minio}
      coolify:
    labels:
      - 'traefik.enable=${TRAEFIK_ENABLE_S3:-true}'
      - 'traefik.http.middlewares.fisilti-s3-strip.stripprefix.prefixes=${TRAEFIK_S3_STRIP_PREFIX:-}'
      - 'traefik.http.middlewares.fisilti-s3-noauth.headers.customrequestheaders.Authorization='
      - 'traefik.http.routers.fisilti-s3-http.rule=${TRAEFIK_S3_RULE:-Host(`s3.fisilti.app`)}'
      - 'traefik.http.routers.fisilti-s3-http.entrypoints=http'
      - 'traefik.http.routers.fisilti-s3-http.middlewares=fisilti-redirect-https,crowdsec@file'
      - 'traefik.http.routers.fisilti-s3.rule=${TRAEFIK_S3_RULE:-Host(`s3.fisilti.app`)}'
      - 'traefik.http.routers.fisilti-s3.entrypoints=https'
      - 'traefik.http.routers.fisilti-s3.tls=true'
      - 'traefik.http.routers.fisilti-s3.tls.certresolver=letsencrypt'
      - 'traefik.http.routers.fisilti-s3.middlewares=fisilti-s3-noauth,${TRAEFIK_S3_MIDDLEWARES:-crowdsec@file}'
      - 'traefik.http.routers.fisilti-s3.priority=${TRAEFIK_S3_PRIORITY:-120}'
      - 'traefik.http.services.fisilti-s3.loadbalancer.server.port=9000'

  # MinIO Başlangıç Bucket Oluşturucu (Tek seferlik)
  minio-init:
    image: quay.io/minio/mc:latest
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_AVATARS: ${MINIO_BUCKET_AVATARS:-avatars}
      MINIO_BUCKET_VOICE: ${MINIO_BUCKET_VOICE:-audio-messages}
      MINIO_BUCKET_MEDIA: ${MINIO_BUCKET_MEDIA:-media}
      MINIO_BUCKET_FILES: ${MINIO_BUCKET_FILES:-files}
    depends_on:
      - minio
    networks:
      - fisilti-network
    entrypoint: >
      sh -c "
      until (mc alias set local http://${MINIO_HOST:-fisilti-minio}:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}); do echo 'MinIO bekleniyor...' && sleep 2; done;
      mc mb --ignore-existing local/$${MINIO_BUCKET_AVATARS};
      mc mb --ignore-existing local/$${MINIO_BUCKET_VOICE};
      mc mb --ignore-existing local/$${MINIO_BUCKET_MEDIA};
      mc mb --ignore-existing local/$${MINIO_BUCKET_FILES};
      mc anonymous set download local/$${MINIO_BUCKET_AVATARS};
      mc anonymous set none local/$${MINIO_BUCKET_VOICE};
      mc anonymous set none local/$${MINIO_BUCKET_MEDIA};
      mc anonymous set none local/$${MINIO_BUCKET_FILES};
      echo 'MinIO bucketlari hazirlandi.';
      exit 0;
      "

  # 4. LiveKit WebRTC SFU
  livekit:
    build:
      context: livekit
      dockerfile: Dockerfile
    restart: always
    command: --config /etc/livekit.yaml --redis-host ${REDIS_ADDR:-${REDIS_HOST:-fisilti-redis}:6379}
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      REDIS_HOST: "${REDIS_ADDR:-${REDIS_HOST:-fisilti-redis}:6379}"
    ports:
      - "7881:7881/udp"
      - "7881:7881/tcp"
    depends_on:
      - redis
    networks:
      fisilti-network:
        aliases:
          - ${LIVEKIT_HOST:-fisilti-livekit}
      coolify:
    labels:
      - 'traefik.enable=true'
      # 1. Dedicated Subdomain Router (Eğer livekit.domain DNS kaydı varsa)
      - 'traefik.http.routers.fisilti-livekit-http.rule=${TRAEFIK_LIVEKIT_RULE:-Host(`livekit.fisilti.app`)}'
      - 'traefik.http.routers.fisilti-livekit-http.entrypoints=http'
      - 'traefik.http.routers.fisilti-livekit-http.middlewares=fisilti-redirect-https,crowdsec@file'
      - 'traefik.http.routers.fisilti-livekit.rule=${TRAEFIK_LIVEKIT_RULE:-Host(`livekit.fisilti.app`)}'
      - 'traefik.http.routers.fisilti-livekit.entrypoints=https'
      - 'traefik.http.routers.fisilti-livekit.tls=true'
      - 'traefik.http.routers.fisilti-livekit.tls.certresolver=letsencrypt'
      - 'traefik.http.routers.fisilti-livekit.middlewares=crowdsec@file'
      - 'traefik.http.routers.fisilti-livekit.service=fisilti-livekit'

      # 2. Same-Domain Path Router (Tek domain kurulumları için /rtc ve /livekit WebRTC sinyalleşmesi)
      - 'traefik.http.middlewares.fisilti-livekit-strip.stripprefix.prefixes=/livekit'
      - 'traefik.http.routers.fisilti-livekit-path-http.rule=${TRAEFIK_LIVEKIT_PATH_RULE:-(Host(`${DOMAIN:-fisilti.app}`) && (PathPrefix(`/rtc`) || PathPrefix(`/livekit`)))}'
      - 'traefik.http.routers.fisilti-livekit-path-http.entrypoints=http'
      - 'traefik.http.routers.fisilti-livekit-path-http.middlewares=fisilti-redirect-https,crowdsec@file'
      - 'traefik.http.routers.fisilti-livekit-path.rule=${TRAEFIK_LIVEKIT_PATH_RULE:-(Host(`${DOMAIN:-fisilti.app}`) && (PathPrefix(`/rtc`) || PathPrefix(`/livekit`)))}'
      - 'traefik.http.routers.fisilti-livekit-path.entrypoints=https'
      - 'traefik.http.routers.fisilti-livekit-path.tls=true'
      - 'traefik.http.routers.fisilti-livekit-path.tls.certresolver=letsencrypt'
      - 'traefik.http.routers.fisilti-livekit-path.middlewares=fisilti-livekit-strip,crowdsec@file'
      - 'traefik.http.routers.fisilti-livekit-path.priority=${TRAEFIK_LIVEKIT_PATH_PRIORITY:-150}'
      - 'traefik.http.routers.fisilti-livekit-path.service=fisilti-livekit'
      - 'traefik.http.services.fisilti-livekit.loadbalancer.server.port=7880'

  # 5. Go Backend Servisi
  backend:
    build:
      context: backend
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env
    environment:
      PORT: "${BACKEND_PORT:-8080}"
      APP_BASE_PATH: "${APP_BASE_PATH:-}"
      COOKIE_PATH: "${COOKIE_PATH:-${APP_BASE_PATH:-/}}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-}"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${BACKEND_PORT:-8080}/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      - postgres
      - redis
      - minio
    networks:
      - fisilti-network
      - coolify
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.middlewares.fisilti-backend-strip.stripprefix.prefixes=${TRAEFIK_BACKEND_STRIP_PREFIX:-}'
      - 'traefik.http.routers.fisilti-backend-http.rule=${TRAEFIK_BACKEND_RULE:-Host(`api.fisilti.app`)}'
      - 'traefik.http.routers.fisilti-backend-http.entrypoints=http'
      - 'traefik.http.routers.fisilti-backend-http.middlewares=fisilti-redirect-https,crowdsec@file'
      - 'traefik.http.routers.fisilti-backend.rule=${TRAEFIK_BACKEND_RULE:-Host(`api.fisilti.app`)}'
      - 'traefik.http.routers.fisilti-backend.entrypoints=https'
      - 'traefik.http.routers.fisilti-backend.tls=true'
      - 'traefik.http.routers.fisilti-backend.tls.certresolver=letsencrypt'
      - 'traefik.http.routers.fisilti-backend.middlewares=${TRAEFIK_BACKEND_MIDDLEWARES:-crowdsec@file}'
      - 'traefik.http.routers.fisilti-backend.priority=${TRAEFIK_BACKEND_PRIORITY:-100}'
      - 'traefik.http.services.fisilti-backend.loadbalancer.server.port=${BACKEND_PORT:-8080}'

  # 6. Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BASE_PATH: "${NEXT_PUBLIC_BASE_PATH:-}"
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-}"
        NEXT_PUBLIC_WS_URL: "${NEXT_PUBLIC_WS_URL:-}"
        NEXT_PUBLIC_LIVEKIT_URL: "${NEXT_PUBLIC_LIVEKIT_URL:-}"
    restart: always
    environment:
      PORT: "${FRONTEND_PORT:-3000}"
      NEXT_PUBLIC_BASE_PATH: "${NEXT_PUBLIC_BASE_PATH:-}"
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-}"
      NEXT_PUBLIC_WS_URL: "${NEXT_PUBLIC_WS_URL:-}"
      NEXT_PUBLIC_LIVEKIT_URL: "${NEXT_PUBLIC_LIVEKIT_URL:-}"
    depends_on:
      - backend
    networks:
      - fisilti-network
      - coolify
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.middlewares.fisilti-redirect-https.redirectscheme.scheme=https'
      - 'traefik.http.middlewares.fisilti-redirect-https.redirectscheme.permanent=true'
      - 'traefik.http.routers.fisilti-frontend-http.rule=${TRAEFIK_FRONTEND_RULE:-Host(`fisilti.app`)}'
      - 'traefik.http.routers.fisilti-frontend-http.entrypoints=http'
      - 'traefik.http.routers.fisilti-frontend-http.middlewares=fisilti-redirect-https,crowdsec@file'
      # 1. Catch-all HTTPS Router (Statik assetler, _rsc, fetch/xhr, favicon, manifest için - Basic Auth challenge üretmez)
      - 'traefik.http.routers.fisilti-frontend.rule=${TRAEFIK_FRONTEND_RULE:-Host(`fisilti.app`)}'
      - 'traefik.http.routers.fisilti-frontend.entrypoints=https'
      - 'traefik.http.routers.fisilti-frontend.tls=true'
      - 'traefik.http.routers.fisilti-frontend.tls.certresolver=letsencrypt'
      - 'traefik.http.routers.fisilti-frontend.middlewares=${TRAEFIK_FRONTEND_MIDDLEWARES:-crowdsec@file}'
      - 'traefik.http.routers.fisilti-frontend.priority=${TRAEFIK_FRONTEND_PRIORITY:-50}'
      - 'traefik.http.routers.fisilti-frontend.service=fisilti-frontend'
      # 2. Document/Navigation HTTPS Router (Yalnızca gerçek HTML GET navigation istekleri için - Basic Auth + CrowdSec)
      - 'traefik.http.routers.fisilti-frontend-doc.rule=${TRAEFIK_FRONTEND_DOCUMENT_RULE:-(${TRAEFIK_FRONTEND_RULE:-Host(`fisilti.app`)}) && Method(`GET`) && HeadersRegexp(`Accept`, `text/html`)}'
      - 'traefik.http.routers.fisilti-frontend-doc.entrypoints=https'
      - 'traefik.http.routers.fisilti-frontend-doc.tls=true'
      - 'traefik.http.routers.fisilti-frontend-doc.tls.certresolver=letsencrypt'
      - 'traefik.http.routers.fisilti-frontend-doc.middlewares=${TRAEFIK_FRONTEND_DOCUMENT_MIDDLEWARES:-${TRAEFIK_FRONTEND_MIDDLEWARES:-crowdsec@file}}'
      - 'traefik.http.routers.fisilti-frontend-doc.priority=${TRAEFIK_FRONTEND_DOCUMENT_PRIORITY:-60}'
      - 'traefik.http.routers.fisilti-frontend-doc.service=fisilti-frontend'
      - 'traefik.http.services.fisilti-frontend.loadbalancer.server.port=${FRONTEND_PORT:-3000}'

networks:
  fisilti-network:
    driver: bridge
  coolify:
    external: true
