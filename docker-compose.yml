services:
  # 1. PostgreSQL 16 Veritabanı
  postgres:
    image: postgres:16-alpine
    container_name: fisilti-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fisilti_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-fisilti}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fisilti_user} -d ${POSTGRES_DB:-fisilti}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis 7 Önbellek, Presence & Pub/Sub
  redis:
    image: redis:7-alpine
    container_name: fisilti-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. MinIO S3 Nesne Depolama Servisi
  minio:
    image: minio/minio:latest
    container_name: fisilti-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-fisilti_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-fisilti_minio_secret_2026}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 4. MinIO Başlangıç Bucket Oluşturucu (Tek seferlik)
  minio-init:
    image: minio/mc:latest
    container_name: fisilti-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-fisilti_admin} ${MINIO_ROOT_PASSWORD:-fisilti_minio_secret_2026}); do echo 'MinIO bekleniyor...' && sleep 1; done;
      /usr/bin/mc mb --ignore-existing local/avatars;
      /usr/bin/mc mb --ignore-existing local/audio-messages;
      /usr/bin/mc mb --ignore-existing local/media;
      /usr/bin/mc mb --ignore-existing local/files;
      /usr/bin/mc anonymous set download local/avatars;
      /usr/bin/mc anonymous set download local/audio-messages;
      /usr/bin/mc anonymous set download local/media;
      /usr/bin/mc anonymous set download local/files;
      echo 'MinIO bucketlari basariyla olusturuldu.';
      exit 0;
      "

  # 5. LiveKit SFU WebRTC Sunucusu (Self-Hosted)
  livekit:
    image: livekit/livekit-server:latest
    container_name: fisilti-livekit
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    ports:
      - "7880:7880"
      - "7881:7881/udp"
      - "7881:7881/tcp"
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml:ro
    depends_on:
      redis:
        condition: service_healthy

  # 6. Go Backend (API & WebSocket Hub)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fisilti-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # 7. Next.js 15 Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fisilti-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3002}:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NEXT_PUBLIC_WS_URL: ws://localhost:8080/ws
      NEXT_PUBLIC_LIVEKIT_URL: http://localhost:7880
    depends_on:
      backend:
        condition: service_started

volumes:
  pg_data:
  redis_data:
  minio_data:
